name: smart_notes_ai
description: Offline Private AI Notepad - Your private AI that summarizes, organizes, and reminds.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  
  # Authentication
  local_auth: ^2.1.7
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # AI/ML
  ffi: ^2.1.0
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  intl: ^0.18.1
  uuid: ^4.2.1
  
  # Voice Input (optional)
  speech_to_text: ^6.5.1
  permission_handler: ^11.1.0
  
  # Utils
  logger: ^2.0.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  
  # Linting
  flutter_lints: ^3.0.1
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    # AI Models (download separately)
    - assets/models/
    
    # Prompt Templates
    - assets/prompts/
    
    # Icons and Images
    - assets/icons/
    - assets/images/
  # Fonts - using system default for now
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
